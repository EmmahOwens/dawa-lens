[package]
name = "dawa-search"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib produces .so on Android / .wasm on wasm32-unknown-unknown;
# rlib allows running unit tests natively via `cargo test`.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Activate JNI bindings when compiling for Android (`--features android`)
android = ["dep:jni"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
jni = { version = "0.21", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
